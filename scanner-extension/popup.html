<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="popup.css"><title>Project Pepsi Scanner</title></head><body>
  <header><div class="mark">P</div><div><h1>Project Pepsi</h1><p>Marketplace scanner</p></div><span id="statusDot"></span></header>
  <main>
    <div id="message" role="status"></div>
    <label>Watch keywords<input id="keywords" placeholder="rolex, omega, tudor"></label>
    <label>Excluded terms<input id="excludedKeywords" placeholder="replica, homage, parts only"></label>
    <div class="grid"><label>Maximum ask<input id="maximumAsk" type="number" min="0"></label><label>Alert score<input id="minimumScore" type="number" min="0" max="100"></label></div>
    <div class="grid"><label>Scan every<input id="intervalMinutes" type="number" min="1" max="60"><small>minutes</small></label><label class="check"><input id="autoScroll" type="checkbox">Gently scroll results</label></div>
    <div class="actions"><button id="toggle" class="primary">Start on this search</button><button id="scanNow">Scan now</button></div>
    <section><div class="sectionHead"><h2>Flagged listings</h2><span id="count"></span></div><div id="listings" class="listings"></div></section>
  </main><script src="popup.js"></script>
</body></html>
